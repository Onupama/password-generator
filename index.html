<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>random-password-generator</title>
		<link rel="stylesheet" href="/src/style.css"/>
    </head>
    <body>
        <main>
            <h1 class="heading">Generate a <br /><span class="highlight">random password</span></h1>
            <p class="sub-heading">Never use an insecure password again.</p>

            <button id="gen-password-btn">Generate passwords</button>
            <div class="line"></div>

            <section class="passwords">
                <input type="text" id="first-password">
                <input type="text" id="second-password">
            </section>

            <section class="password-length">
                <form id="form">
                    <label for="input-el">Set password length: </label>
                    <input type="number" id="input-el">
                </form>
            </section>
            <p id="password-el"></p>
        </main>
    <script type="module" src="/src/main.js"></script>
    </body>
</html>
